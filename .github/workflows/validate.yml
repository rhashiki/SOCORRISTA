name: Validate Re.Force Build

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-reforce
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check JavaScript syntax
        run: |
          set -e
          for f in *.js; do echo "Checking $f"; node --check "$f"; done

      - name: Verify index local assets
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, sys
          html=Path('index.html').read_text(encoding='utf-8')
          refs=re.findall(r'(?:src|href)=["\']\.\/([^?"\']+)',html)
          missing=[p for p in refs if not Path(p).exists()]
          print('Local assets:', len(refs))
          if missing:
              print('Missing:', missing); sys.exit(1)
          PY

      - name: Check integrated script order for declaration conflicts
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script[^>]+src=["\']\.\/([^?"\']+)',html)
          scripts=[s for s in scripts if Path(s).exists()]
          print('Integration order:')
          print('\n'.join(f'{i+1:02d}. {s}' for i,s in enumerate(scripts)))
          Path('/tmp/reforce-integrated.js').write_text('\n;\n'.join(Path(s).read_text(encoding='utf-8') for s in scripts),encoding='utf-8')
          PY
          node --check /tmp/reforce-integrated.js

      - name: Verify current build markers
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, sys
          html=Path('index.html').read_text(encoding='utf-8')
          sw=Path('sw.js').read_text(encoding='utf-8')
          state=Path('state-v6.js').read_text(encoding='utf-8')
          m=re.search(r'<meta name="reforce-build" content="(\d+)"',html)
          if not m: print('Missing reforce-build meta'); sys.exit(1)
          build=int(m.group(1))
          if f'reforce-openworld-v{build}' not in sw: print('Service Worker cache mismatch'); sys.exit(1)
          required=['incident-v8.js','director-v30.js','integration-v30.js']
          if build>=35: required += ['materials-v31.js','patientvisual-v32.js','traffic-v33.js','radio-v34.js','scenario-v35.js']
          if build>=40: required += ['map-v36.js','camera-v37.js','lighting-v38.js','transportvisual-v39.js','trafficvariety-v40.js']
          if build>=45: required += ['ambient-v41.js','instructor-v42.js','urbandetail-v43.js','npc-v44.js','shift-v45.js']
          if build>=50: required += ['responderpose-v46.js','dialogue-v47.js','vehicleentry-v48.js','driving-v49.js','mission-v50.js']
          if build>=55: required += ['architecture-v51.js','vehiclevisual-v52.js','animation-v53.js','lod-v54.js','scenequality-v55.js']
          if build>=60: required += ['textures-v56.js','crowdvisual-v57.js','contactshadow-v58.js','camerapolish-v59.js','skyline-v60.js']
          if build>=65: required += ['roadwear-v61.js','streetvehicles-v62.js','faces-v63.js','streetlife-v64.js','atmosphere-v65.js']
          if build>=70: required += ['vehicleorientation-v66.js','movement-v67.js','wayfinding-v68.js','hudcontext-v69.js','autoperf-v70.js']
          if build>=75:
              required += ['district-v71.js','incidentlocations-v72.js','outertraffic-v73.js','outerpedestrians-v74.js','roadroute-v75.js']
              if 'const WORLD=210;' not in state: print('Expanded-world marker missing'); sys.exit(1)
          if build>=80: required += ['expandedmap-v76.js','landmarks-v77.js','districtstream-v78.js','outerlanes-v79.js','vehiclecontrols-v80.js','visual-v80.css']
          if build>=85: required += ['characterquality-v81.js','locomotion-v82.js','ambulance-v83.js','trafficmotion-v84.js','renderstyle-v85.js']
          if build>=90: required += ['patientexpression-v86.js','outerfacades-v87.js','streetdensity-v88.js','maplabels-v89.js','shadowfocus-v90.js']
          if build>=94: required += ['performancefix-v93.js','firstperson-v94.js','visual-v94.css']
          if build>=95: required += ['desktopperf-v95.js']
          missing=[x for x in required if x not in html]
          if missing: print('Missing integration markers:',missing); sys.exit(1)
          if build>=91:
              css=Path('visual-v36.css').read_text(encoding='utf-8').replace(' ','').replace('\n','')
              mapjs=Path('map-v36.js').read_text(encoding='utf-8')
              if '.full-map-modal[hidden]{display:none!important}' not in css:
                  print('Map hidden regression: CSS does not force hidden modal off'); sys.exit(1)
              if 'function v36SetVisible' not in mapjs or "modal.style.display='none'" not in mapjs:
                  print('Map hidden regression: explicit JS visibility guard missing'); sys.exit(1)
              if './visual-v36.css?v=91' not in html or './map-v36.js?v=91' not in html:
                  print('Map hotfix cache-bust markers missing'); sys.exit(1)
          if build>=92:
              required92=['glasgowfix-v92.js','hotfix-v92.css']
              missing92=[x for x in required92 if x not in html]
              if missing92: print('Glasgow hotfix assets missing:',missing92); sys.exit(1)
              css92=Path('hotfix-v92.css').read_text(encoding='utf-8').replace(' ','').replace('\n','')
              js92=Path('glasgowfix-v92.js').read_text(encoding='utf-8')
              if '[hidden]{display:none!important}' not in css92:
                  print('Global hidden regression guard missing'); sys.exit(1)
              if "clinicalStage!=='D'" not in js92 or "['E','V','M'].every" not in js92:
                  print('Glasgow stage/evidence guard missing'); sys.exit(1)
              if 'AO — Abertura Ocular' not in html or 'RV — Resposta Verbal' not in html or 'RM — Resposta Motora' not in html:
                  print('Glasgow PT-BR labels missing'); sys.exit(1)
              if './glasgowfix-v92.js?v=92' not in html or './hotfix-v92.css?v=92' not in html:
                  print('Glasgow hotfix cache-bust markers missing'); sys.exit(1)
          if build>=95:
              perf95=Path('desktopperf-v95.js').read_text(encoding='utf-8')
              markers=['antialias:false',"heavyShadows=profile==='high'&&!V95_COARSE","return p==='high'?60:p==='eco'?24:30",'camera.far=v95FarPlane()','V95_TRAFFIC_ACC<1/hz','V95_PED_ACC<1/hz']
              miss=[x for x in markers if x not in perf95]
              if miss: print('Build 95 performance contract missing:',miss); sys.exit(1)
              if './desktopperf-v95.js?v=95' not in html or './integration-v30.js?v=95' not in html:
                  print('Build 95 cache-bust/integration markers missing'); sys.exit(1)
          print('Validated build',build)
          PY
