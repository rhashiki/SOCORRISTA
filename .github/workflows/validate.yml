name: Validate Re.Force Build

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-reforce
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check JavaScript syntax
        run: |
          set -e
          for f in *.js; do
            echo "Checking $f"
            node --check "$f"
          done

      - name: Verify index local assets
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, sys
          html=Path('index.html').read_text(encoding='utf-8')
          refs=re.findall(r'(?:src|href)=["\']\.\/([^?"\']+)',html)
          missing=[p for p in refs if not Path(p).exists()]
          print('Local assets:', len(refs))
          if missing:
              print('Missing:', missing)
              sys.exit(1)
          PY

      - name: Check integrated script order for declaration conflicts
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script[^>]+src=["\']\.\/([^?"\']+)',html)
          scripts=[s for s in scripts if Path(s).exists()]
          print('Integration order:')
          print('\n'.join(f'{i+1:02d}. {s}' for i,s in enumerate(scripts)))
          Path('/tmp/reforce-integrated.js').write_text('\n;\n'.join(Path(s).read_text(encoding='utf-8') for s in scripts),encoding='utf-8')
          PY
          node --check /tmp/reforce-integrated.js

      - name: Verify current build markers
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, sys
          html=Path('index.html').read_text(encoding='utf-8')
          sw=Path('sw.js').read_text(encoding='utf-8')
          m=re.search(r'<meta name="reforce-build" content="(\d+)"',html)
          if not m:
              print('Missing reforce-build meta')
              sys.exit(1)
          build=int(m.group(1))
          expected=f'reforce-openworld-v{build}'
          if expected not in sw:
              print('Service Worker cache mismatch:', expected)
              sys.exit(1)
          required=['incident-v8.js','director-v30.js','integration-v30.js']
          if build>=35: required += ['materials-v31.js','patientvisual-v32.js','traffic-v33.js','radio-v34.js','scenario-v35.js']
          if build>=40: required += ['map-v36.js','camera-v37.js','lighting-v38.js','transportvisual-v39.js','trafficvariety-v40.js']
          if build>=45: required += ['ambient-v41.js','instructor-v42.js','urbandetail-v43.js','npc-v44.js','shift-v45.js']
          if build>=50: required += ['responderpose-v46.js','dialogue-v47.js','vehicleentry-v48.js','driving-v49.js','mission-v50.js']
          if build>=55: required += ['architecture-v51.js','vehiclevisual-v52.js','animation-v53.js','lod-v54.js','scenequality-v55.js']
          if build>=60: required += ['textures-v56.js','crowdvisual-v57.js','contactshadow-v58.js','camerapolish-v59.js','skyline-v60.js']
          if build>=65: required += ['roadwear-v61.js','streetvehicles-v62.js','faces-v63.js','streetlife-v64.js','atmosphere-v65.js']
          if build>=70: required += ['vehicleorientation-v66.js','movement-v67.js','wayfinding-v68.js','hudcontext-v69.js','autoperf-v70.js']
          missing=[x for x in required if x not in html]
          if missing:
              print('Missing integration markers:',missing)
              sys.exit(1)
          print('Validated build',build)
          PY
