name: Validate Performance Rescue

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-reforce-performance
  cancel-in-progress: true

jobs:
  performance-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check performance scripts syntax
        run: |
          node --check performancefix-v93.js
          node --check firstperson-v94.js
          node --check desktopperf-v95.js
          node --check integration-v30.js

      - name: Verify performance contract
        run: |
          python - <<'PY'
          from pathlib import Path
          import sys,re
          perf=Path('performancefix-v93.js').read_text(encoding='utf-8')
          fps=Path('firstperson-v94.js').read_text(encoding='utf-8')
          desk=Path('desktopperf-v95.js').read_text(encoding='utf-8')
          html=Path('index.html').read_text(encoding='utf-8')
          boot=Path('integration-v30.js').read_text(encoding='utf-8')
          required_perf=[
              'const dt=Math.min(raw,.12)',
              'v54ApplyLOD=function()',
              'function v93PixelCap()',
          ]
          missing=[x for x in required_perf if x not in perf]
          if missing:
              print('Base performance contract missing:',missing);sys.exit(1)
          required95=[
              'antialias:false',
              "heavyShadows=profile==='high'&&!V95_COARSE",
              "return p==='high'?60:p==='eco'?24:30",
              'V95_TRAFFIC_ACC<1/hz',
              'V95_PED_ACC<1/hz',
              'camera.far=v95FarPlane()',
              "return Math.min(d,V95_COARSE?.66:.76)",
          ]
          missing95=[x for x in required95 if x not in desk]
          if missing95:
              print('Desktop performance contract missing:',missing95);sys.exit(1)
          for marker in ['./performancefix-v93.js?v=94','./firstperson-v94.js?v=94','./desktopperf-v95.js?v=95']:
              if marker not in html:
                  print('Performance layer not integrated:',marker);sys.exit(1)
          if 'antialias:false' not in fps:
              print('FPS mobile render budget missing');sys.exit(1)
          if "start.disabled=true" not in boot or "start.disabled=false" not in boot:
              print('Start-button readiness guard missing');sys.exit(1)
          m=re.search(r'<meta name="reforce-build" content="(\d+)"',html)
          if not m or int(m.group(1))<95:
              print('Build marker is older than desktop rescue release');sys.exit(1)
          print('Build',m.group(1),'performance contract validated')
          PY
